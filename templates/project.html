<!DOCTYPE html>
<html>
<head>
<title>Register</title>
<style>
body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#0f172a,#1e293b);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}
.form-box{
width:400px;
background:rgba(255,255,255,0.1);
padding:30px;
border-radius:15px;
}
h1{
text-align:center;
color:#38bdf8;
}
input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:5px;
}
button{
width:100%;
padding:12px;
background:#38bdf8;
border:none;
border-radius:25px;
cursor:pointer;
font-weight:bold;
}
</style>
</head>
<body>

<div class="form-box">

<h1>Register</h1>

<form>
<input type="text" placeholder="Full Name" required>
<input type="email" placeholder="Email" required>
<input type="password" placeholder="Password" required>
<input type="password" placeholder="Confirm Password" required>

<button type="submit">Register</button>
</form>

</div>

</body>
</html>
