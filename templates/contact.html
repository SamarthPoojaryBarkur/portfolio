<!DOCTYPE html>
<html>
<head>
<title>Contact</title>
<style>
body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#0f172a,#1e293b);
color:white;
padding:50px;
}
.container{
max-width:600px;
margin:auto;
background:rgba(255,255,255,0.1);
padding:30px;
border-radius:15px;
}
h1{
text-align:center;
color:#38bdf8;
}
input,textarea{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:5px;
}
button{
background:#38bdf8;
padding:12px 25px;
border:none;
border-radius:25px;
cursor:pointer;
}
</style>
</head>
<body>

<div class="container">
<h1>Contact Me</h1>

<form>
<input type="text" placeholder="Your Name">
<input type="email" placeholder="Your Email">
<textarea rows="5" placeholder="Your Message"></textarea>
<button type="submit">Send Message</button>
</form>

</div>

</body>
</html>
